name: Publicación

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Carga rama de Git
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Instala Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Carga caché Nix
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # v14

      - name: Carga caché general
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .direnv
            .pnpm-store
            ~/.local/share/pnpm
            ~/.elm
          key: ${{ runner.os }}-cache

      - name: Información del entorno
        run: |
          nix develop .#ci --command pnpm store path
          echo "HOME=$HOME"
          echo "ELM_HOME=$ELM_HOME"

      - name: Sube a GH Pages
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          nix develop .#ci --command just deploy-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
